<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DS 사물함 예약 시스템</title>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .locker-cell {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
        }

        @keyframes pulse-border {
            0% {
                border-color: rgba(37, 99, 235, 0.5);
            }

            50% {
                border-color: rgba(37, 99, 235, 1);
            }

            100% {
                border-color: rgba(37, 99, 235, 0.5);
            }
        }

        .mine-highlight {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

<div id="root"></div>

<script type="text/babel" data-type="module">

    const {
        useState,
        useEffect,
        useCallback
    } = React;


    /* =========================================================
       Firebase
    ========================================================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    import {
        getFirestore,
        collection,
        doc,
        setDoc,
        deleteDoc,
        onSnapshot,
        getDocs,
        writeBatch
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


    /* =========================================================
       새 Firebase 프로젝트
    ========================================================= */

    const firebaseConfig = {

        apiKey: "AIzaSyB0GlULzskkU2g3X2A1_0rtlKv34lAkTtY",

        authDomain: "ds-locker.firebaseapp.com",

        projectId: "ds-locker",

        storageBucket: "ds-locker.firebasestorage.app",

        messagingSenderId: "514012629826",

        appId: "1:514012629826:web:1da5b2e1cda3e7aa8956db"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);



    /* =========================================================
       사물함 구조
    ========================================================= */

    const ROWS = [
        'A',
        'B',
        'C',
        'D',
        'E'
    ];

    const COLS = Array.from(
        { length: 18 },
        (_, i) => i + 1
    );



    /* =========================================================
       Icon
    ========================================================= */

    const Icon = ({
        name,
        className,
        ...props
    }) => {

        useEffect(() => {

            if (window.lucide) {
                window.lucide.createIcons();
            }

        }, [name]);

        return (
            <i
                data-lucide={name}
                className={className}
                {...props}
            ></i>
        );
    };



    /* =========================================================
       App
    ========================================================= */

    function App() {


        /* ---------------------------------------------------------
           Firebase / 데이터 상태
        --------------------------------------------------------- */

        const [user, setUser] = useState(null);

        const [lockers, setLockers] = useState({});

        const [config, setConfig] = useState({

            allowedMembers: [],

            disabledSlots: [],

            adminCode: 'admin123',

            isSystemLocked: false
        });


        /* ---------------------------------------------------------
           사용자 입력
        --------------------------------------------------------- */

        const [studentId, setStudentId] = useState('');

        const [userName, setUserName] = useState('');

        const [isLoggedIn, setIsLoggedIn] = useState(false);


        /* ---------------------------------------------------------
           화면 상태
        --------------------------------------------------------- */

        const [loading, setLoading] = useState(true);

        const [error, setError] = useState(null);

        const [toast, setToast] = useState(null);

        const [confirmModal, setConfirmModal] = useState(null);


        /* ---------------------------------------------------------
           관리자 상태
        --------------------------------------------------------- */

        const [isAdmin, setIsAdmin] = useState(false);

        const [showAdminPanel, setShowAdminPanel] = useState(false);

        const [adminInput, setAdminInput] = useState('');

        const [adminNewStudentId, setAdminNewStudentId] = useState('');

        const [adminNewName, setAdminNewName] = useState('');

        const [newAdminCode, setNewAdminCode] = useState('');

        const [editMode, setEditMode] = useState('reserve');



        /* =========================================================
           알림
        ========================================================= */

        const showToast = useCallback(
            (message, type = 'info') => {

                setToast({
                    message,
                    type
                });

                setTimeout(() => {
                    setToast(null);
                }, 3000);
            },
            []
        );



        /* =========================================================
           1. Firebase 익명 로그인
        ========================================================= */

        useEffect(() => {

            const unsubscribe = onAuthStateChanged(
                auth,
                (firebaseUser) => {

                    setUser(firebaseUser);

                }
            );


            const login = async () => {

                try {

                    if (!auth.currentUser) {

                        await signInAnonymously(auth);

                    }

                } catch (err) {

                    console.error(
                        "Firebase Authentication Error:",
                        err
                    );

                    setError(
                        "Firebase 로그인에 실패했습니다."
                    );

                    setLoading(false);
                }
            };


            login();


            return () => {

                unsubscribe();

            };

        }, []);



        /* =========================================================
           2. Firestore 실시간 데이터
        ========================================================= */

        useEffect(() => {

            if (!user) {
                return;
            }


            /* -----------------------------------------------------
               lockers
            ----------------------------------------------------- */

            const lockersRef = collection(
                db,
                'lockers'
            );


            const unsubscribeLockers = onSnapshot(

                lockersRef,

                (snapshot) => {

                    const data = {};


                    snapshot.forEach(
                        (document) => {

                            data[document.id] =
                                document.data();

                        }
                    );


                    console.log(
                        "사물함 데이터:",
                        data
                    );


                    setLockers(data);

                    setLoading(false);

                },

                (err) => {

                    console.error(
                        "lockers 읽기 오류:",
                        err
                    );

                    setError(
                        "사물함 데이터를 불러오지 못했습니다."
                    );

                    setLoading(false);
                }
            );



            /* -----------------------------------------------------
               members
            ----------------------------------------------------- */

            const membersRef = collection(
                db,
                'members'
            );


            const unsubscribeMembers = onSnapshot(

                membersRef,

                (snapshot) => {

                    const members = [];


                    snapshot.forEach(
                        (document) => {

                            members.push({

                                studentId:
                                    document.id,

                                name:
                                    document.data().name || ''

                            });

                        }
                    );


                    console.log(
                        "학생 명단:",
                        members
                    );


                    setConfig(
                        (previous) => ({

                            ...previous,

                            allowedMembers:
                                members

                        })
                    );

                },

                (err) => {

                    console.error(
                        "members 읽기 오류:",
                        err
                    );

                    setError(
                        "학생 명단을 불러오지 못했습니다."
                    );
                }
            );



            /* -----------------------------------------------------
               settings/system
            ----------------------------------------------------- */

            const systemRef = doc(
                db,
                'settings',
                'system'
            );


            const unsubscribeSystem = onSnapshot(

                systemRef,

                (snapshot) => {

                    const data =
                        snapshot.exists()
                            ? snapshot.data()
                            : {};


                    console.log(
                        "시스템 설정:",
                        data
                    );


                    setConfig(
                        (previous) => ({

                            ...previous,

                            disabledSlots:
                                data.disabledSlots || [],

                            adminCode:
                                data.adminCode || 'admin123',

                            isSystemLocked:
                                data.isLocked || false

                        })
                    );

                },

                (err) => {

                    console.error(
                        "settings 읽기 오류:",
                        err
                    );

                    setError(
                        "시스템 설정을 불러오지 못했습니다."
                    );
                }
            );



            return () => {

                unsubscribeLockers();

                unsubscribeMembers();

                unsubscribeSystem();

            };

        }, [user]);



        /* =========================================================
           본인 예약 여부
        ========================================================= */

        const isMySlot = useCallback(

            (lockerData) => {

                if (
                    !lockerData ||
                    !isLoggedIn
                ) {
                    return false;
                }


                return (

                    lockerData.studentId ===
                        studentId.trim()

                    &&

                    lockerData.name ===
                        userName.trim()

                );

            },

            [
                studentId,
                userName,
                isLoggedIn
            ]
        );



        /* =========================================================
           등록 학생 확인
        ========================================================= */

        const checkAuthorization =
            useCallback(

                () => {

                    const sId =
                        studentId.trim();

                    const uName =
                        userName.trim();


                    if (
                        !sId ||
                        !uName
                    ) {
                        return false;
                    }


                    return config.allowedMembers.some(
                        (member) =>

                            member.studentId === sId

                            &&

                            member.name === uName
                    );

                },

                [
                    studentId,
                    userName,
                    config.allowedMembers
                ]
            );



        /* =========================================================
           사물함 클릭
        ========================================================= */

        const handleSlotClick =
            async (slotId) => {


                /* -------------------------------------------------
                   관리자 : 차단 모드
                ------------------------------------------------- */

                if (
                    isAdmin &&
                    editMode === 'manage-slots'
                ) {

                    try {

                        const newList =
                            config.disabledSlots.includes(slotId)

                                ? config.disabledSlots.filter(
                                    id => id !== slotId
                                )

                                : [
                                    ...config.disabledSlots,
                                    slotId
                                ];


                        await setDoc(

                            doc(
                                db,
                                'settings',
                                'system'
                            ),

                            {
                                disabledSlots:
                                    newList
                            },

                            {
                                merge: true
                            }
                        );


                        showToast(
                            config.disabledSlots.includes(slotId)
                                ? `${slotId} 차단 해제`
                                : `${slotId} 차단 완료`
                        );


                    } catch (err) {

                        console.error(err);

                        showToast(
                            "차단 설정 실패",
                            "error"
                        );

                    }


                    return;
                }



                const locker =
                    lockers[slotId];


                const isMine =
                    isMySlot(locker);



                /* -------------------------------------------------
                   시스템 잠금
                ------------------------------------------------- */

                if (
                    config.isSystemLocked &&
                    !isAdmin
                ) {

                    showToast(
                        "현재 예약 시스템이 잠겨 있습니다.",
                        "error"
                    );

                    return;
                }



                /* -------------------------------------------------
                   예약 취소
                ------------------------------------------------- */

                if (
                    locker &&
                    (
                        isMine ||
                        isAdmin
                    )
                ) {

                    setConfirmModal({

                        title:
                            isAdmin && !isMine
                                ? "관리자 강제 삭제"
                                : "예약 취소",

                        message:
                            isAdmin && !isMine

                                ? `[${locker.studentId} ${locker.name}] 학생의 예약을 취소합니까?`

                                : "본인의 사물함 예약을 취소하시겠습니까?",


                        onConfirm:
                            async () => {

                                try {

                                    await deleteDoc(

                                        doc(
                                            db,
                                            'lockers',
                                            slotId
                                        )

                                    );


                                    showToast(
                                        "예약이 취소되었습니다.",
                                        "success"
                                    );


                                } catch (err) {

                                    console.error(err);

                                    showToast(
                                        "예약 취소 실패",
                                        "error"
                                    );

                                }


                                setConfirmModal(null);
                            }

                    });


                    return;
                }



                /* -------------------------------------------------
                   이미 다른 사람이 예약
                ------------------------------------------------- */

                if (locker) {

                    showToast(
                        "이미 예약된 사물함입니다.",
                        "error"
                    );

                    return;
                }



                /* -------------------------------------------------
                   차단 자리
                ------------------------------------------------- */

                if (
                    config.disabledSlots.includes(
                        slotId
                    )
                ) {

                    showToast(
                        "사용할 수 없는 사물함입니다.",
                        "error"
                    );

                    return;
                }



                /* -------------------------------------------------
                   학생 인증 전
                ------------------------------------------------- */

                if (!isLoggedIn) {

                    showToast(
                        "학번과 이름을 입력하고 설정 완료를 눌러주세요.",
                        "error"
                    );

                    return;
                }



                /* -------------------------------------------------
                   명단 확인
                ------------------------------------------------- */

                if (!checkAuthorization()) {

                    showToast(
                        "등록되지 않은 학생입니다.",
                        "error"
                    );

                    return;
                }



                /* -------------------------------------------------
                   이미 예약한 자리 존재
                ------------------------------------------------- */

                const alreadyReserved =
                    Object.values(lockers).some(

                        (lockerData) =>

                            lockerData.studentId ===
                            studentId.trim()

                    );


                if (alreadyReserved) {

                    showToast(
                        "이미 예약한 사물함이 있습니다.",
                        "error"
                    );

                    return;
                }



                /* -------------------------------------------------
                   예약 저장
                ------------------------------------------------- */

                try {

                    await setDoc(

                        doc(
                            db,
                            'lockers',
                            slotId
                        ),

                        {

                            studentId:
                                studentId.trim(),

                            name:
                                userName.trim(),

                            uid:
                                user.uid,

                            timestamp:
                                Date.now()

                        }
                    );


                    showToast(
                        `${slotId} 예약 성공!`,
                        "success"
                    );


                } catch (err) {

                    console.error(
                        "예약 오류:",
                        err
                    );

                    showToast(
                        "예약에 실패했습니다.",
                        "error"
                    );

                }

            };



        /* =========================================================
           시스템 잠금
        ========================================================= */

        const toggleSystemLock =
            async () => {

                try {

                    const newStatus =
                        !config.isSystemLocked;


                    await setDoc(

                        doc(
                            db,
                            'settings',
                            'system'
                        ),

                        {
                            isLocked:
                                newStatus
                        },

                        {
                            merge: true
                        }

                    );


                    showToast(

                        newStatus

                            ? "예약 시스템을 잠갔습니다."

                            : "예약 시스템 잠금을 해제했습니다.",

                        "success"

                    );


                } catch (err) {

                    console.error(err);

                    showToast(
                        "시스템 설정 실패",
                        "error"
                    );

                }

            };



        /* =========================================================
           사용자 정보 초기화
        ========================================================= */

        const handleResetInfo =
            () => {

                setStudentId('');

                setUserName('');

                setIsLoggedIn(false);


                showToast(
                    "입력 정보가 초기화되었습니다."
                );

            };



        /* =========================================================
           학생 추가
        ========================================================= */

        const addSingleMember =
            async () => {

                const sId =
                    adminNewStudentId.trim();

                const uName =
                    adminNewName.trim();


                if (
                    !sId ||
                    !uName
                ) {

                    showToast(
                        "학번과 이름을 입력하세요.",
                        "error"
                    );

                    return;
                }


                if (
                    config.allowedMembers.some(
                        member =>
                            member.studentId === sId
                    )
                ) {

                    showToast(
                        "이미 등록된 학번입니다.",
                        "error"
                    );

                    return;
                }


                try {

                    await setDoc(

                        doc(
                            db,
                            'members',
                            sId
                        ),

                        {
                            name:
                                uName
                        }

                    );


                    setAdminNewStudentId('');

                    setAdminNewName('');


                    showToast(
                        "학생 명단 추가 완료",
                        "success"
                    );


                } catch (err) {

                    console.error(err);

                    showToast(
                        "학생 추가 실패",
                        "error"
                    );

                }

            };



        /* =========================================================
           학생 삭제
        ========================================================= */

        const removeMember =
            async (studentIdToRemove) => {

                try {

                    await deleteDoc(

                        doc(
                            db,
                            'members',
                            studentIdToRemove
                        )

                    );


                    showToast(
                        "학생 명단 삭제 완료",
                        "success"
                    );


                } catch (err) {

                    console.error(err);

                    showToast(
                        "학생 삭제 실패",
                        "error"
                    );

                }

            };



        /* =========================================================
           관리자 비밀번호 변경
        ========================================================= */

        const changeAdminCode =
            async () => {

                const code =
                    newAdminCode.trim();


                if (!code) {

                    showToast(
                        "새 비밀번호를 입력하세요.",
                        "error"
                    );

                    return;
                }


                try {

                    await setDoc(

                        doc(
                            db,
                            'settings',
                            'system'
                        ),

                        {
                            adminCode:
                                code
                        },

                        {
                            merge: true
                        }

                    );


                    setNewAdminCode('');


                    showToast(
                        "관리자 비밀번호가 변경되었습니다.",
                        "success"
                    );


                } catch (err) {

                    console.error(err);

                    showToast(
                        "비밀번호 변경 실패",
                        "error"
                    );

                }

            };



        /* =========================================================
           전체 예약 초기화
        ========================================================= */

        const resetAllReservations =
            async () => {

                const ok = confirm(
                    "주의! 모든 예약 데이터가 삭제됩니다. 계속할까요?"
                );


                if (!ok) {
                    return;
                }


                try {

                    const snapshot =
                        await getDocs(
                            collection(
                                db,
                                'lockers'
                            )
                        );


                    const batch =
                        writeBatch(db);


                    snapshot.forEach(
                        (document) => {

                            batch.delete(
                                document.ref
                            );

                        }
                    );


                    await batch.commit();


                    showToast(
                        "모든 예약을 초기화했습니다.",
                        "success"
                    );


                } catch (err) {

                    console.error(err);

                    showToast(
                        "초기화 실패",
                        "error"
                    );

                }

            };



        /* =========================================================
           로딩 / 오류
        ========================================================= */

        if (error) {

            return (

                <div
                    className="
                        h-screen
                        flex
                        items-center
                        justify-center
                        p-6
                        text-red-500
                        font-bold
                        text-center
                    "
                >

                    {error}

                </div>
            );
        }


        if (loading) {

            return (

                <div
                    className="
                        h-screen
                        flex
                        items-center
                        justify-center
                        font-bold
                        text-slate-400
                        animate-pulse
                        text-lg
                    "
                >

                    데이터 로딩 중...

                </div>
            );
        }



        /* =========================================================
           화면
        ========================================================= */

        return (

            <div className="min-h-screen pb-20">


                {/* =================================================
                    Toast
                ================================================= */}

                {toast && (

                    <div
                        className={`
                            fixed
                            top-6
                            left-1/2
                            -translate-x-1/2
                            z-[100]
                            px-6
                            py-3
                            rounded-2xl
                            shadow-2xl
                            flex
                            items-center
                            gap-3
                            text-white
                            text-sm
                            font-bold

                            ${
                                toast.type === 'error'
                                    ? 'bg-red-600'
                                    : toast.type === 'success'
                                    ? 'bg-green-600'
                                    : 'bg-slate-800'
                            }
                        `}
                    >

                        <Icon
                            name={
                                toast.type === 'error'
                                    ? 'alert-circle'
                                    : 'check-circle'
                            }
                            className="w-5 h-5"
                        />

                        {toast.message}

                    </div>
                )}



                {/* =================================================
                    확인 Modal
                ================================================= */}

                {confirmModal && (

                    <div
                        className="
                            fixed
                            inset-0
                            bg-black/60
                            backdrop-blur-sm
                            z-[110]
                            flex
                            items-center
                            justify-center
                            p-4
                            text-center
                        "
                    >

                        <div
                            className="
                                bg-white
                                rounded-[2rem]
                                p-8
                                max-w-sm
                                w-full
                                shadow-2xl
                            "
                        >

                            <h3
                                className="
                                    text-xl
                                    font-black
                                    mb-2
                                "
                            >
                                {confirmModal.title}
                            </h3>


                            <p
                                className="
                                    text-slate-500
                                    mb-6
                                    text-sm
                                "
                            >
                                {confirmModal.message}
                            </p>


                            <div className="flex gap-3">

                                <button
                                    onClick={() =>
                                        setConfirmModal(null)
                                    }
                                    className="
                                        flex-1
                                        py-3
                                        rounded-xl
                                        bg-slate-100
                                        font-bold
                                    "
                                >
                                    취소
                                </button>


                                <button
                                    onClick={
                                        confirmModal.onConfirm
                                    }
                                    className="
                                        flex-1
                                        py-3
                                        rounded-xl
                                        bg-blue-600
                                        text-white
                                        font-bold
                                    "
                                >
                                    확인
                                </button>

                            </div>

                        </div>

                    </div>
                )}



                {/* =================================================
                    Navbar
                ================================================= */}

                <div
                    className="
                        bg-white
                        shadow-sm
                        border-b
                        sticky
                        top-0
                        z-50
                        px-4
                        h-16
                        flex
                        items-center
                        justify-between
                    "
                >

                    <div className="flex items-center gap-2">

                        <div
                            className="
                                bg-blue-600
                                p-2
                                rounded-lg
                            "
                        >

                            <Icon
                                name="shield-check"
                                className="w-5 h-5 text-white"
                            />

                        </div>


                        <span
                            className="
                                font-black
                                text-lg
                                tracking-tighter
                            "
                        >
                            DS 사물함 예약 시스템
                        </span>


                        {config.isSystemLocked && (

                            <span
                                className="
                                    ml-2
                                    bg-red-100
                                    text-red-600
                                    px-2
                                    py-0.5
                                    rounded
                                    text-[10px]
                                    font-bold
                                "
                            >
                                변경 잠금됨
                            </span>

                        )}

                    </div>



                    <div className="flex items-center gap-3">

                        <button
                            onClick={handleResetInfo}
                            className="
                                text-xs
                                font-bold
                                bg-blue-50
                                text-blue-700
                                px-3
                                py-2
                                rounded-xl
                                hover:bg-blue-100
                                flex
                                items-center
                                gap-1
                                h-10
                            "
                        >

                            <Icon
                                name="user-plus"
                                className="w-3 h-3"
                            />

                            다른 학생으로 예약

                        </button>


                        <button
                            onClick={() =>
                                setShowAdminPanel(
                                    !showAdminPanel
                                )
                            }
                            className="
                                p-2.5
                                hover:bg-slate-100
                                rounded-xl
                            "
                        >

                            <Icon
                                name="settings"
                                className="w-5 h-5 text-slate-400"
                            />

                        </button>

                    </div>

                </div>



                <div
                    className="
                        max-w-[1700px]
                        mx-auto
                        p-4
                        md:p-8
                    "
                >


                    {/* =================================================
                        관리자 Panel
                    ================================================= */}

                    {showAdminPanel && (

                        <div
                            className="
                                mb-8
                                bg-slate-900
                                rounded-[2.5rem]
                                p-6
                                text-white
                                shadow-2xl
                            "
                        >

                            <div
                                className="
                                    flex
                                    justify-between
                                    items-center
                                    mb-6
                                    border-b
                                    border-slate-800
                                    pb-4
                                "
                            >

                                <h2
                                    className="
                                        font-bold
                                        text-blue-400
                                        flex
                                        items-center
                                        gap-2
                                    "
                                >

                                    <Icon
                                        name="lock"
                                        className="w-4 h-4"
                                    />

                                    Admin Mode

                                </h2>



                                {!isAdmin ? (

                                    <div className="flex gap-2">

                                        <input
                                            type="password"
                                            placeholder="비밀번호"
                                            value={adminInput}
                                            onChange={
                                                e =>
                                                    setAdminInput(
                                                        e.target.value
                                                    )
                                            }
                                            className="
                                                bg-slate-800
                                                px-3
                                                py-1.5
                                                rounded-lg
                                                text-sm
                                                border
                                                border-slate-700
                                                w-28
                                                text-white
                                                outline-none
                                            "
                                        />


                                        <button
                                            onClick={() => {

                                                if (
                                                    adminInput ===
                                                    config.adminCode
                                                ) {

                                                    setIsAdmin(true);

                                                    setAdminInput('');

                                                    showToast(
                                                        "관리자 인증 완료",
                                                        "success"
                                                    );

                                                } else {

                                                    showToast(
                                                        "비밀번호가 일치하지 않습니다.",
                                                        "error"
                                                    );

                                                }

                                            }}
                                            className="
                                                bg-blue-600
                                                px-4
                                                py-1.5
                                                rounded-lg
                                                text-sm
                                                font-bold
                                            "
                                        >
                                            인증
                                        </button>

                                    </div>

                                ) : (

                                    <button
                                        onClick={() =>
                                            setIsAdmin(false)
                                        }
                                        className="
                                            bg-red-500/10
                                            text-red-500
                                            px-3
                                            py-1
                                            rounded-lg
                                            text-xs
                                            font-bold
                                        "
                                    >
                                        Logout
                                    </button>

                                )}

                            </div>



                            {isAdmin && (

                                <div
                                    className="
                                        grid
                                        md:grid-cols-3
                                        gap-6
                                    "
                                >


                                    {/* 학생 추가 */}

                                    <div
                                        className="
                                            bg-slate-800
                                            p-5
                                            rounded-2xl
                                            border
                                            border-slate-700
                                        "
                                    >

                                        <p
                                            className="
                                                text-xs
                                                font-black
                                                text-blue-300
                                                mb-4
                                                text-center
                                            "
                                        >
                                            개별 명단 등록
                                        </p>


                                        <div className="space-y-3">

                                            <input
                                                type="text"
                                                placeholder="학번"
                                                value={
                                                    adminNewStudentId
                                                }
                                                onChange={
                                                    e =>
                                                        setAdminNewStudentId(
                                                            e.target.value
                                                        )
                                                }
                                                className="
                                                    w-full
                                                    bg-slate-900
                                                    p-3
                                                    rounded-xl
                                                    text-sm
                                                    border
                                                    border-slate-700
                                                    text-white
                                                "
                                            />


                                            <input
                                                type="text"
                                                placeholder="이름"
                                                value={
                                                    adminNewName
                                                }
                                                onChange={
                                                    e =>
                                                        setAdminNewName(
                                                            e.target.value
                                                        )
                                                }
                                                className="
                                                    w-full
                                                    bg-slate-900
                                                    p-3
                                                    rounded-xl
                                                    text-sm
                                                    border
                                                    border-slate-700
                                                    text-white
                                                "
                                            />


                                            <button
                                                onClick={
                                                    addSingleMember
                                                }
                                                className="
                                                    w-full
                                                    bg-blue-600
                                                    py-3
                                                    rounded-xl
                                                    font-bold
                                                    text-sm
                                                "
                                            >
                                                명단 추가
                                            </button>

                                        </div>

                                    </div>



                                    {/* 학생 목록 */}

                                    <div
                                        className="
                                            bg-slate-800
                                            p-5
                                            rounded-2xl
                                            border
                                            border-slate-700
                                        "
                                    >

                                        <p
                                            className="
                                                text-xs
                                                font-black
                                                text-blue-300
                                                mb-4
                                                text-center
                                            "
                                        >

                                            등록 명단 (
                                            {config.allowedMembers.length}명)

                                        </p>


                                        <div
                                            className="
                                                max-h-64
                                                overflow-y-auto
                                                custom-scrollbar
                                                flex
                                                flex-col
                                                gap-1
                                            "
                                        >

                                            {
                                                config.allowedMembers.map(
                                                    member => (

                                                        <div
                                                            key={
                                                                member.studentId
                                                            }
                                                            className="
                                                                bg-slate-900
                                                                px-3
                                                                py-2
                                                                rounded-lg
                                                                text-xs
                                                                flex
                                                                items-center
                                                                justify-between
                                                            "
                                                        >

                                                            <span>

                                                                <span
                                                                    className="
                                                                        text-slate-500
                                                                        mr-2
                                                                    "
                                                                >
                                                                    {
                                                                        member.studentId
                                                                    }
                                                                </span>

                                                                {
                                                                    member.name
                                                                }

                                                            </span>


                                                            <button
                                                                onClick={() =>
                                                                    removeMember(
                                                                        member.studentId
                                                                    )
                                                                }
                                                                className="
                                                                    text-red-400
                                                                    p-1
                                                                "
                                                            >

                                                                <Icon
                                                                    name="trash-2"
                                                                    className="w-4 h-4"
                                                                />

                                                            </button>

                                                        </div>

                                                    )
                                                )
                                            }

                                        </div>

                                    </div>



                                    {/* 시스템 관리 */}

                                    <div
                                        className="
                                            bg-slate-800
                                            p-5
                                            rounded-2xl
                                            border
                                            border-slate-700
                                            flex
                                            flex-col
                                            gap-4
                                        "
                                    >

                                        <button
                                            onClick={
                                                toggleSystemLock
                                            }
                                            className={`
                                                w-full
                                                py-3
                                                rounded-xl
                                                font-bold
                                                text-sm

                                                ${
                                                    config.isSystemLocked

                                                        ? 'bg-green-600'

                                                        : 'bg-red-600'
                                                }
                                            `}
                                        >

                                            {
                                                config.isSystemLocked

                                                    ? "예약 잠금 해제"

                                                    : "예약 시스템 잠금"
                                            }

                                        </button>



                                        <div className="flex gap-2">

                                            <button
                                                onClick={() =>
                                                    setEditMode(
                                                        'reserve'
                                                    )
                                                }
                                                className={`
                                                    flex-1
                                                    py-2.5
                                                    rounded-lg
                                                    text-xs
                                                    font-bold

                                                    ${
                                                        editMode === 'reserve'

                                                            ? 'bg-blue-600'

                                                            : 'bg-slate-700'
                                                    }
                                                `}
                                            >
                                                예약 관리
                                            </button>


                                            <button
                                                onClick={() =>
                                                    setEditMode(
                                                        'manage-slots'
                                                    )
                                                }
                                                className={`
                                                    flex-1
                                                    py-2.5
                                                    rounded-lg
                                                    text-xs
                                                    font-bold

                                                    ${
                                                        editMode === 'manage-slots'

                                                            ? 'bg-amber-500'

                                                            : 'bg-slate-700'
                                                    }
                                                `}
                                            >
                                                차단 모드
                                            </button>

                                        </div>



                                        <div
                                            className="
                                                border-t
                                                border-slate-700
                                                pt-4
                                            "
                                        >

                                            <p
                                                className="
                                                    text-xs
                                                    font-bold
                                                    text-blue-300
                                                    mb-2
                                                "
                                            >
                                                관리자 비밀번호
                                            </p>


                                            <div className="flex gap-2">

                                                <input
                                                    type="password"
                                                    placeholder="새 비밀번호"
                                                    value={newAdminCode}
                                                    onChange={
                                                        e =>
                                                            setNewAdminCode(
                                                                e.target.value
                                                            )
                                                    }
                                                    className="
                                                        flex-1
                                                        bg-slate-900
                                                        p-2
                                                        rounded-lg
                                                        text-xs
                                                        border
                                                        border-slate-700
                                                    "
                                                />


                                                <button
                                                    onClick={
                                                        changeAdminCode
                                                    }
                                                    className="
                                                        bg-slate-700
                                                        px-3
                                                        py-2
                                                        rounded-lg
                                                        text-xs
                                                        font-bold
                                                    "
                                                >
                                                    저장
                                                </button>

                                            </div>

                                        </div>



                                        <button
                                            onClick={
                                                resetAllReservations
                                            }
                                            className="
                                                border
                                                border-red-500/30
                                                text-red-400
                                                py-2.5
                                                rounded-lg
                                                text-xs
                                                font-bold
                                                hover:bg-red-500
                                                hover:text-white
                                            "
                                        >
                                            모든 예약 초기화
                                        </button>

                                    </div>

                                </div>

                            )}

                        </div>

                    )}



                    {/* =================================================
                        학생 인증
                    ================================================= */}

                    <div
                        className="
                            bg-white
                            rounded-[2.5rem]
                            shadow-xl
                            p-6
                            md:p-8
                            mb-8
                            border
                            border-slate-100
                        "
                    >

                        <p
                            className="
                                text-xs
                                font-black
                                text-slate-400
                                mb-4
                                text-center
                            "
                        >
                            학번과 이름을 입력한 후 설정 완료를 눌러주세요.
                        </p>


                        <div
                            className="
                                flex
                                flex-col
                                md:flex-row
                                gap-4
                                items-end
                            "
                        >

                            <div
                                className="
                                    flex-1
                                    w-full
                                    grid
                                    grid-cols-1
                                    md:grid-cols-2
                                    gap-4
                                "
                            >

                                <input
                                    type="text"
                                    value={studentId}
                                    onChange={
                                        e =>
                                            setStudentId(
                                                e.target.value
                                            )
                                    }
                                    placeholder="학번"
                                    className="
                                        w-full
                                        px-6
                                        py-4
                                        bg-slate-50
                                        rounded-2xl
                                        border-2
                                        border-transparent
                                        focus:border-blue-500
                                        outline-none
                                        font-bold
                                        text-lg
                                        h-16
                                    "
                                />


                                <input
                                    type="text"
                                    value={userName}
                                    onChange={
                                        e =>
                                            setUserName(
                                                e.target.value
                                            )
                                    }
                                    placeholder="이름"
                                    className="
                                        w-full
                                        px-6
                                        py-4
                                        bg-slate-50
                                        rounded-2xl
                                        border-2
                                        border-transparent
                                        focus:border-blue-500
                                        outline-none
                                        font-bold
                                        text-lg
                                        h-16
                                    "
                                />

                            </div>



                            <button
                                onClick={() => {

                                    if (
                                        !studentId.trim() ||
                                        !userName.trim()
                                    ) {

                                        showToast(
                                            "학번과 이름을 모두 입력해주세요.",
                                            "error"
                                        );

                                        return;
                                    }


                                    if (
                                        checkAuthorization()
                                    ) {

                                        setIsLoggedIn(true);

                                        showToast(
                                            "인증되었습니다. 사물함을 선택하세요.",
                                            "success"
                                        );

                                    } else {

                                        setIsLoggedIn(false);

                                        showToast(
                                            "등록되지 않은 학생입니다.",
                                            "error"
                                        );

                                    }

                                }}
                                className="
                                    px-10
                                    py-4
                                    bg-blue-600
                                    text-white
                                    rounded-2xl
                                    font-black
                                    shadow-lg
                                    hover:bg-blue-700
                                    w-full
                                    md:w-auto
                                    h-16
                                "
                            >
                                설정 완료
                            </button>

                        </div>

                    </div>



                    {/* =================================================
                        사물함
                    ================================================= */}

                    <div
                        className={`
                            bg-white
                            rounded-[3rem]
                            p-6
                            shadow-2xl
                            overflow-x-auto
                            border-8

                            ${
                                editMode === 'manage-slots'

                                    ? 'border-amber-400'

                                    : 'border-white'
                            }

                            custom-scrollbar
                        `}
                    >

                        <div className="w-fit mx-auto">


                            {/* 열 번호 */}

                            <div
                                className="
                                    flex
                                    gap-2
                                    mb-4
                                    pl-[60px]
                                "
                            >

                                {
                                    COLS.map(
                                        col => (

                                            <div
                                                key={col}
                                                className="
                                                    locker-cell
                                                    flex
                                                    items-center
                                                    justify-center
                                                    font-black
                                                    text-slate-300
                                                    text-sm
                                                "
                                            >
                                                {col}열
                                            </div>

                                        )
                                    )
                                }

                            </div>



                            {
                                ROWS.map(
                                    row => (

                                        <div
                                            key={row}
                                            className="
                                                flex
                                                gap-2
                                                mb-2
                                            "
                                        >


                                            {/* 행 */}

                                            <div
                                                className="
                                                    w-[50px]
                                                    flex
                                                    items-center
                                                    justify-center
                                                    font-black
                                                    text-3xl
                                                    text-blue-600
                                                    bg-blue-50/50
                                                    rounded-2xl
                                                    mr-2
                                                "
                                            >
                                                {row}
                                            </div>



                                            {
                                                COLS.map(
                                                    col => {

                                                        const id =
                                                            `${row}${col}`;

                                                        const locker =
                                                            lockers[id];

                                                        const mine =
                                                            isMySlot(locker);

                                                        const disabled =
                                                            config.disabledSlots.includes(
                                                                id
                                                            );

                                                        const occupied =
                                                            !!locker;


                                                        return (

                                                            <button
                                                                key={id}
                                                                onClick={() =>
                                                                    handleSlotClick(
                                                                        id
                                                                    )
                                                                }
                                                                className={`
                                                                    locker-cell
                                                                    rounded-2xl
                                                                    border-2
                                                                    transition-all
