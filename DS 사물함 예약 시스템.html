                                                                    flex
                                                                    flex-col
                                                                    items-center
                                                                    justify-center
                                                                    relative
                                                                    group

                                                                    ${
                                                                        disabled

                                                                            ? 'bg-red-50 border-red-100 text-red-300'

                                                                            : mine

                                                                            ? 'bg-blue-600 border-blue-700 text-white shadow-xl mine-highlight'

                                                                            : occupied

                                                                            ? 'bg-slate-100 border-slate-200 text-slate-400'

                                                                            : 'bg-white border-slate-100 hover:border-blue-400 hover:shadow-xl text-slate-300'
                                                                    }
                                                                `}
                                                            >


                                                                {
                                                                    disabled

                                                                    ? (

                                                                        <>
                                                                            <Icon
                                                                                name="ban"
                                                                                className="w-6 h-6"
                                                                            />

                                                                            <span
                                                                                className="
                                                                                    text-[10px]
                                                                                    font-bold
                                                                                    mt-1
                                                                                "
                                                                            >
                                                                                사용 불가
                                                                            </span>
                                                                        </>

                                                                    )

                                                                    : mine

                                                                    ? (

                                                                        <>
                                                                            <Icon
                                                                                name="check-circle"
                                                                                className="w-5 h-5 mb-1"
                                                                            />

                                                                            <span
                                                                                className="
                                                                                    text-[10px]
                                                                                    font-black
                                                                                    truncate
                                                                                    px-1
                                                                                    w-full
                                                                                "
                                                                            >
                                                                                {
                                                                                    locker.name
                                                                                }
                                                                            </span>
                                                                        </>

                                                                    )

                                                                    : occupied

                                                                    ? (

                                                                        <>
                                                                            <Icon
                                                                                name="lock"
                                                                                className="w-4 h-4 mb-1"
                                                                            />

                                                                            <span
                                                                                className="
                                                                                    text-[9px]
                                                                                    font-bold
                                                                                "
                                                                            >
                                                                                {
                                                                                    isAdmin

                                                                                        ? locker.name

                                                                                        : "예약 완료"
                                                                                }
                                                                            </span>


                                                                            {
                                                                                isAdmin && (

                                                                                    <div
                                                                                        className="
                                                                                            absolute
                                                                                            inset-0
                                                                                            bg-red-600/90
                                                                                            rounded-2xl
                                                                                            opacity-0
                                                                                            group-hover:opacity-100
                                                                                            flex
                                                                                            flex-col
                                                                                            items-center
                                                                                            justify-center
                                                                                            text-white
                                                                                        "
                                                                                    >

                                                                                        <span className="text-[8px]">
                                                                                            {
                                                                                                locker.studentId
                                                                                            }
                                                                                        </span>

                                                                                        <span className="text-[10px] font-bold">
                                                                                            {
                                                                                                locker.name
                                                                                            }
                                                                                        </span>

                                                                                        <Icon
                                                                                            name="trash-2"
                                                                                            className="w-4 h-4 mt-1"
                                                                                        />

                                                                                    </div>

                                                                                )
                                                                            }

                                                                        </>

                                                                    )

                                                                    : (

                                                                        <>
                                                                            <Icon
                                                                                name="unlock"
                                                                                className="w-4 h-4 opacity-20 mb-1"
                                                                            />

                                                                            <span
                                                                                className="
                                                                                    text-[10px]
                                                                                    font-black
                                                                                "
                                                                            >
                                                                                {id}
                                                                            </span>
                                                                        </>

                                                                    )
                                                                }

                                                            </button>

                                                        );

                                                    }
                                                )
                                            }

                                        </div>

                                    )
                                )
                            }

                        </div>

                    </div>



                    {/* =================================================
                        범례
                    ================================================= */}

                    <div
                        className="
                            mt-10
                            flex
                            flex-wrap
                            gap-10
                            justify-center
                            text-[10px]
                            font-black
                            text-slate-400
                        "
                    >

                        <div className="flex items-center gap-3">

                            <div
                                className="
                                    w-5
                                    h-5
                                    bg-white
                                    border-2
                                    border-slate-200
                                    rounded-lg
                                "
                            ></div>

                            빈 자리

                        </div>


                        <div className="flex items-center gap-3">

                            <div
                                className="
                                    w-5
                                    h-5
                                    bg-blue-600
                                    rounded-lg
                                "
                            ></div>

                            내 사물함

                        </div>


                        <div className="flex items-center gap-3">

                            <div
                                className="
                                    w-5
                                    h-5
                                    bg-slate-100
                                    rounded-lg
                                "
                            ></div>

                            예약 완료

                        </div>


                        <div className="flex items-center gap-3">

                            <div
                                className="
                                    w-5
                                    h-5
                                    bg-red-50
                                    border
                                    border-red-100
                                    rounded-lg
                                "
                            ></div>

    const root =
